<header class="module-header">
  <h2>🎵 Daily Soundtrack</h2>
</header>

<nav class="tabs" role="tablist" aria-label="Soundtrack Navigation">
  <button class="tab active" data-tab="daily" role="tab" aria-selected="true" aria-controls="tab-daily">Daily Plan</button>
  <button class="tab" data-tab="playlists" role="tab" aria-selected="false" aria-controls="tab-playlists">Playlists</button>
  <button class="tab" data-tab="maintenance" role="tab" aria-selected="false" aria-controls="tab-maintenance">Maintenance</button>
</nav>

<div class="tab-content">

  <section id="tab-daily" class="tab-panel active" role="tabpanel">
    <div class="daily-plan-controls">
      <button id="regenBtn" class="btn-secondary">
        <span id="regenIcon" class="icon">⟳</span> 
        <span>Regenerate</span>
      </button>
      <div id="lastRegenInfo" class="last-regen"></div>
    </div>

    <div id="planLoader" class="loader hidden" aria-label="Loading your plan..."></div>
    <div id="dailyPlan" class="section">
        <p class="text-muted">No plan generated yet. Hit regenerate to start.</p>
    </div>
  </section>

  <section id="tab-playlists" class="tab-panel" role="tabpanel">
    <div class="section">
        <h3>➕ Add Playlist</h3>
        <div id="addPlaylistForm">
          <div class="card">
            <input type="text" id="newName" placeholder="Playlist name" />
            
            <div style="margin: 10px 0;">
              <label>Priority (1–5)</label>
              <input type="number" id="newPriority" min="1" max="5" value="3" style="width: 60px; margin-left: 10px;"/>
            </div>

            <div class="context-chips" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px;">
              <label><input type="checkbox" value="Gym" /> Gym</label>
              <label><input type="checkbox" value="Work" /> Work</label>
              <label><input type="checkbox" value="Driving" /> Driving</label>
              <label><input type="checkbox" value="Relax" /> Relax</label>
              <label><input type="checkbox" value="Free" /> Free</label>
            </div>
            
            <button id="addPlaylistBtn" class="btn-primary">Add Playlist</button>
          </div>
        </div>
    </div>

    <div class="section">
        <h3>📚 Manage Playlists</h3>
        <div id="playlistManager"></div>
    </div>
  </section>

  <section id="tab-maintenance" class="tab-panel" role="tabpanel">
    <div class="section review-module">
      <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
        <h3>🎲 Random Review</h3>
        <button id="refreshRandomBtn" class="btn-secondary btn-sm">
          <span class="icon">⟳</span> New Set
        </button>
      </div>
      <p class="text-muted">Review these 3 playlists to keep your library healthy.</p>
      
      <div id="randomReviewContainer" class="card-grid review-grid">
        <p class="text-muted">Loading review set...</p>
      </div>
    </div>

    <hr class="divider" />

    <div class="section">
      <h3>🧹 Dormant Playlists</h3>
      <div id="cleaningList"></div>
    </div>
  </section>

</div>

<div id="toastContainer" class="toast-container"></div>
